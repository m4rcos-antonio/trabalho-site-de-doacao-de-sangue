<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Doação de Sangue</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="donor-page">
    <div class="donor-container">
        <div class="donor-back-link">
            <a href="home.html">← Voltar</a>
        </div>

        <div class="donor-card">
            <div class="donor-card-header">
                <h1 class="donor-card-title">Cadastro de Doador</h1>
                <p class="donor-card-description">Preencha seus dados para se registrar como doador de sangue</p>
            </div>

            <div class="donor-card-content">
                <form id="formCadastroDonor" class="donor-form">
                    <!-- Dados Pessoais -->
                    <div class="donor-form-section">
                        <h3 class="donor-section-title">Dados Pessoais</h3>
                        
                        <div class="donor-form-row">
                            <div class="donor-form-group">
                                <label for="fullName">Nome Completo *</label>
                                <input 
                                    type="text" 
                                    id="fullName" 
                                    name="fullName" 
                                    placeholder="João Silva"
                                    required
                                >
                            </div>

                            <div class="donor-form-group">
                                <label for="cpf">CPF *</label>
                                <input 
                                    type="text" 
                                    id="cpf" 
                                    name="cpf" 
                                    placeholder="123.456.789-00"
                                    maxlength="14"
                                    required
                                >
                            </div>
                        </div>

                        <div class="donor-form-row">
                            <div class="donor-form-group">
                                <label for="dateOfBirth">Data de Nascimento *</label>
                                <input 
                                    type="date" 
                                    id="dateOfBirth" 
                                    name="dateOfBirth"
                                    required
                                >
                            </div>

                            <div class="donor-form-group">
                                <label for="weight">Peso (kg) *</label>
                                <input 
                                    type="number" 
                                    id="weight" 
                                    name="weight" 
                                    placeholder="70"
                                    min="40"
                                    required
                                >
                            </div>
                        </div>

                        <div class="donor-form-group">
                            <label for="bloodType">Tipo Sanguíneo *</label>
                            <select id="bloodType" name="bloodType" required>
                                <option value="">Selecione seu tipo sanguíneo</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </div>
                    </div>

                    <!-- Contato -->
                    <div class="donor-form-section">
                        <h3 class="donor-section-title">Contato</h3>
                        
                        <div class="donor-form-row">
                            <div class="donor-form-group">
                                <label for="email">E-mail *</label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    placeholder="seu.email@exemplo.com"
                                    required
                                >
                            </div>

                            <div class="donor-form-group">
                                <label for="phone">Telefone *</label>
                                <input 
                                    type="tel" 
                                    id="phone" 
                                    name="phone" 
                                    placeholder="(11) 98765-4321"
                                    required
                                >
                            </div>
                        </div>
                    </div>

                    <!-- Endereço -->
                    <div class="donor-form-section">
                        <h3 class="donor-section-title">Endereço</h3>
                        
                        <div class="donor-form-group">
                            <label for="address">Rua e Número *</label>
                            <input 
                                type="text" 
                                id="address" 
                                name="address" 
                                placeholder="Rua Principal, 123"
                                required
                            >
                        </div>

                        <div class="donor-form-row-3">
                            <div class="donor-form-group">
                                <label for="city">Cidade *</label>
                                <input 
                                    type="text" 
                                    id="city" 
                                    name="city" 
                                    placeholder="São Paulo"
                                    required
                                >
                            </div>

                            <div class="donor-form-group">
                                <label for="state">Estado *</label>
                                <select id="state" name="state" required>
                                    <option value="">Selecione</option>
                                    <option value="AC">AC</option>
                                    <option value="AL">AL</option>
                                    <option value="AP">AP</option>
                                    <option value="AM">AM</option>
                                    <option value="BA">BA</option>
                                    <option value="CE">CE</option>
                                    <option value="DF">DF</option>
                                    <option value="ES">ES</option>
                                    <option value="GO">GO</option>
                                    <option value="MA">MA</option>
                                    <option value="MT">MT</option>
                                    <option value="MS">MS</option>
                                    <option value="MG">MG</option>
                                    <option value="PA">PA</option>
                                    <option value="PB">PB</option>
                                    <option value="PR">PR</option>
                                    <option value="PE">PE</option>
                                    <option value="PI">PI</option>
                                    <option value="RJ">RJ</option>
                                    <option value="RN">RN</option>
                                    <option value="RS">RS</option>
                                    <option value="RO">RO</option>
                                    <option value="RR">RR</option>
                                    <option value="SC">SC</option>
                                    <option value="SP">SP</option>
                                    <option value="SE">SE</option>
                                    <option value="TO">TO</option>
                                </select>
                            </div>

                            <div class="donor-form-group">
                                <label for="zipCode">CEP *</label>
                                <input 
                                    type="text" 
                                    id="zipCode" 
                                    name="zipCode" 
                                    placeholder="01310-100"
                                    maxlength="9"
                                    required
                                >
                            </div>
                        </div>
                    </div>

                    <!-- Botões -->
                    <div class="donor-form-actions">
                        <button type="submit" class="donor-btn donor-btn-primary">Cadastrar Doador</button>
                        <a href="listar-doadores.html" class="donor-btn donor-btn-secondary">Ver Doadores</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="cadastro-doadores.js"></script>
</body>
</html>
